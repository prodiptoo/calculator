<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{
        margin:9;
        padding:0;
       }
       body{
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-wrap: wrap;
        justify-content: center; 
        align-items: center;
         background-color : #010736; 
       }
       .mainbody{
        display: flex;
        background-color:#0D1C42;
        width:180px;
        height:350px;
        justify-content: center;
        align-items: center;
        border: 1.8px solid black;
        border-radius:5px;
        flex-direction: column;
        margin: 2px;
        padding:8px;
        
       }
       .screen{
        background-color:#FFF6DC;
        width:160px;
        height:50px;
        margin-top:8px;
        border:1.5px ridge black ;
        border-radius:5px;
        margin-bottom:5px;
       }
       .buttonbody{
        background-color: #22396F;
        height: 250px;
        width: 140px;
        margin-bottom:5px;
        border:2px solid black ;
        border-radius:2px;
        margin: 2px;
        padding:8px;
        display: flex;
        flex-wrap: wrap;
        
       }
       .b{
        display:flex;
        width:30px;
        height:30px;
        background-color: #f8f8f8;
        border-radius:5px;
        border:2px solid black;
        text-align: center;
        justify-content: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size:20px;
        font-weight:bold;
        
       }
       .b:hover{
        background-color: antiquewhite;
        color: rgb(189, 36, 36);
        transform:scale(1.1);
       }




    </style>
</head>
<body>
    <div class=mainbody>
        <div class="screen"></div>
        <div class="buttonbody">
            <div class="b">1</div>
            <div class="b">2</div>
            <div class="b">3</div>
            <div class="b">4</div>
            
            <div class="b">5</div>
            <div class="b">6</div>
            <div class="b">7</div>
            <div class="b">8</div>
            <div class="b">9</div>
            <div class="b">0</div>
            <div class="b">+</div>
            <div class="b">-</div>
            <div class="b">*</div>
            <div class="b">%</div>
            <div class="b">/</div>
            <div class="b">=</div>
        </div>
    </div>
    
</body>
</html>
